<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 25%;
            height: 50vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .door-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        
        .door-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .passcode {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5%;
            height: auto;
        }
    </style>
    <link rel="stylesheet" href="main_escape_room.html">
</head>
<body>
    <div class="door-container">
        <img src="Door.png" alt="Full screen image">
        <img src="Passkode.png" alt="Passcode" class="passcode">
    </div>
</body>
</html>
